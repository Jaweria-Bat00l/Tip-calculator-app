<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>
  
  <!-- Preconnect and Google Fonts fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <article class="profile-card">
      <header>
        <img 
          src="./assets/images/avatar-jessica.jpeg" 
          alt="Portrait of Jessica Randall" 
          class="profile-avatar"
          width="88"
          height="88"
        >
        <h1 class="profile-name">Jessica Randall</h1>
        <p class="profile-location">London, United Kingdom</p>
      </header>

      <p class="profile-bio">"Front-end developer and avid reader."</p>

      <nav class="social-links" aria-label="Social media links">
        <ul class="social-links-list">
          <li class="social-link-item">
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
          </li>
          <li class="social-link-item">
            <a href="https://www.frontendmentor.io" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>
          </li>
          <li class="social-link-item">
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          </li>
          <li class="social-link-item">
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">Twitter</a>
          </li>
          <li class="social-link-item">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
          </li>
        </ul>
      </nav>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="https://github.com" target="_blank" rel="noopener noreferrer">Batool Jaweria</a>.
  </footer>

</body>
</html>
